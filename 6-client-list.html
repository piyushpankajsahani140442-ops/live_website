<style>
    /* All page design is written here. No separate CSS file is needed. */
/* ===== Food Mania - main stylesheet (client + shared) ===== */
/* ---------- colours and basic values (change colours only here) ---------- */
:root {
  --green: #2E7D32; --green-dark: #1B5E20; --green-light: #F1F8E9;
  --accent: #E65100; --text: #263238; --muted: #607D8B;
  --bg: #FAFAF5; --border: #E0E0E0; --radius: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', Arial, sans-serif; font-size: 16px; line-height: 1.5; color: var(--text); background: var(--bg); }
a { color: var(--green); text-decoration: none; }
img { max-width: 100%; display: block; }
h1 { font-size: 36px; margin: 24px 0 16px; color: var(--green-dark); }
h2 { font-size: 28px; margin-bottom: 16px; color: var(--green-dark); }
h3 { font-size: 18px; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.section { padding: 32px 0; border-top: 1px dashed var(--border); }
.muted { color: var(--muted); font-size: 14px; }
.hidden { display: none; }

/* ---------- navbar ---------- */
.navbar { display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 20px; color: var(--green-dark); }
.logo img { height: 40px; }
.navbar nav a { margin: 0 12px; color: var(--text); font-weight: 500; padding-bottom: 4px; }
.navbar nav a:hover, .navbar nav a.active { color: var(--green); border-bottom: 2px solid var(--green); }
.nav-right { display: flex; gap: 12px; align-items: center; }
.nav-right a { border: 1px solid var(--text); border-radius: 8px; padding: 4px 12px; color: var(--text); font-size: 14px; }
.nav-right a#loginLink { background: var(--green); color: #fff; border-color: var(--green); font-weight: bold; }

/* ---------- buttons ---------- */
.btn { display: inline-block; background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
.btn:hover { background: #BF360C; }
.btn-sm { padding: 6px 12px; font-size: 14px; }
.btn-green { background: var(--green); } .btn-green:hover { background: var(--green-dark); }
.btn-outline { background: #fff; color: var(--text); border: 1px solid var(--text); } .btn-outline:hover { background: var(--green-light); }
.btn-red { background: #C62828; } .btn-red:hover { background: #8E0000; }

/* ---------- forms ---------- */
label { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; margin: 12px 0 4px; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 16px; background: #fff; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); }
input[type=checkbox], input[type=radio] { width: auto; margin-right: 8px; }
textarea { min-height: 90px; resize: vertical; }
.box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.error { color: #C62828; font-size: 14px; margin-top: 8px; min-height: 20px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

/* ---------- hero ---------- */
.hero { display: flex; align-items: center; gap: 32px; min-height: 420px; padding: 24px 0; }
.hero .text { flex: 1 1 0; min-width: 0; } .hero .text p { margin: 16px 0 24px; color: var(--muted); }
.hero img { flex: 1 1 0; min-width: 0; width: 100%; border-radius: var(--radius); max-height: 400px; object-fit: cover; }

/* ---------- cards in a grid ---------- */
.card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.card-grid.grid3 { grid-template-columns: repeat(3, 1fr); }
.card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform 0.3s; }
.card:hover { transform: translateY(-4px); }
.card-body { padding: 12px 16px 16px; }
.card-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.dish-img { width: 100%; height: 180px; object-fit: cover; background: #E0E0E0; }
.cat-card img { width: 100%; height: 150px; object-fit: cover; }
.cat-card h3 { text-align: center; padding: 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
.stepper button { border: none; background: #fff; width: 28px; height: 28px; cursor: pointer; font-size: 16px; }
.stepper span { min-width: 24px; text-align: center; font-size: 14px; }
.why { text-align: center; padding: 16px; } .why .emoji { font-size: 40px; }
.stars { color: #F9A825; }
.review { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }

/* ---------- menu page ---------- */
.menu-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; margin-bottom: 32px; }
.toolbar { display: grid; grid-template-columns: 1fr 220px; gap: 16px; margin-bottom: 16px; }
.chip { display: inline-block; border: 1px solid var(--green); color: var(--green); border-radius: 16px; padding: 2px 12px; font-size: 13px; margin: 2px 4px 2px 0; }
.pager { display: flex; justify-content: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.pager button { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-family: inherit; }
.pager button.on { background: var(--green); color: #fff; border-color: var(--green); }

/* ---------- dish detail ---------- */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 24px 0; }
.detail img.big { width: 100%; height: 360px; object-fit: cover; border-radius: var(--radius); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.thumbs img { height: 70px; width: 100%; object-fit: cover; border-radius: 6px; }
.price { font-size: 28px; font-weight: bold; margin: 8px 0; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th { background: #EEE; font-size: 13px; text-transform: uppercase; text-align: left; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.thumb60 { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
.cart-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; }
.profile-layout { grid-template-columns: 1fr 2fr; }
.bill-row { display: flex; justify-content: space-between; padding: 4px 0; }
.bill-total { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; font-weight: bold; }

/* ---------- order status colours (same everywhere) ---------- */
.badge { display: inline-block; padding: 2px 12px; border-radius: 16px; color: #fff; font-size: 13px; white-space: nowrap; }
.st-Pending { background: #F9A825; } .st-Confirmed { background: #1976D2; } .st-Preparing { background: #EF6C00; }
.st-Out-for-Delivery { background: #6A1B9A; } .st-Delivered { background: #2E7D32; } .st-Cancelled { background: #C62828; }

/* ---------- order tracking ---------- */
.steps { display: flex; justify-content: space-between; margin: 24px 0; }
.step { flex: 1; text-align: center; position: relative; font-size: 14px; }
.step .dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: #fff; margin: 0 auto 8px; line-height: 32px; font-weight: bold; }
.step.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
.step.now { font-weight: bold; }

/* ---------- footer ---------- */
.footer { background: var(--green-dark); color: #fff; margin-top: 48px; padding: 32px 24px 16px; }
.footer-grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 24px; }
.footer a { color: #C8E6C9; display: block; font-size: 14px; } .footer h4 { margin-bottom: 8px; } .footer p { font-size: 14px; }
.copy { max-width: 1100px; margin: 24px auto 0; border-top: 1px solid #4CAF50; padding-top: 12px; font-size: 13px; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .card-grid, .card-grid.grid3 { grid-template-columns: repeat(2, 1fr); }
  .menu-layout, .cart-layout, .profile-layout, .detail, .two-col { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  h1 { font-size: 28px; }
  .card-grid, .card-grid.grid3 { grid-template-columns: 1fr; }
  .navbar { flex-direction: column; height: auto; gap: 8px; padding: 8px; }
  .navbar nav { display: flex; flex-wrap: wrap; justify-content: center; }
  .hero { flex-direction: column; } .toolbar { grid-template-columns: 1fr; } .footer-grid { grid-template-columns: 1fr; }
  .steps { font-size: 11px; }
}

/* Admin panel design */
/* ===== Food Mania - admin panel styles (loaded after style.css) ===== */
.admin-top { display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--border); font-weight: bold; color: var(--green-dark); }
.admin-wrap { display: flex; min-height: calc(100vh - 56px); }
.sidebar { width: 220px; background: var(--green-dark); padding: 16px 0; flex-shrink: 0; }
.sidebar small { display: block; color: #A5D6A7; padding: 12px 20px 4px; font-size: 12px; }
.sidebar a { display: block; color: #fff; padding: 8px 20px; border-left: 4px solid transparent; }
.sidebar a:hover, .sidebar a.active { background: var(--green); border-left-color: #fff; }
.admin-main { flex: 1; padding: 24px; min-width: 0; }
.admin-main h1 { margin-top: 0; font-size: 30px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 16px 0 24px; }
.stat { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stat b { font-size: 28px; display: block; color: var(--green-dark); }
.stat-grid.three { grid-template-columns: repeat(3, 1fr); }
.chart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
.bars { display: flex; align-items: flex-end; gap: 12px; height: 160px; margin-top: 8px; }
.bars div { flex: 1; text-align: center; font-size: 12px; } .bars span { display: block; background: var(--green); border-radius: 4px 4px 0 0; }
.hbar { margin-top: 8px; }
.hbar-back { background: #EEE; border-radius: 6px; height: 12px; }
.hbar-fill { height: 12px; border-radius: 6px; }
.thumb50 { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
.filters-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filters-row input { max-width: 280px; } .filters-row select { max-width: 200px; }
.pill { border: 1px solid var(--border); background: #fff; border-radius: 16px; padding: 4px 14px; cursor: pointer; font-family: inherit; }
.pill.on { background: var(--green); color: #fff; border-color: var(--green); }
.status-select { width: auto; padding: 4px 8px; font-size: 14px; }
.review-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--border); align-items: center; }
.login-box { max-width: 380px; margin: 64px auto; }
.add-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
@media (max-width: 900px) { .stat-grid, .stat-grid.three { grid-template-columns: 1fr 1fr; } .chart-grid, .add-layout { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  .admin-wrap { flex-direction: column; }
  .sidebar { width: 100%; display: flex; flex-wrap: wrap; padding: 0; } .sidebar small { display: none; }
  .sidebar a { border-left: none; padding: 8px 12px; } .stat-grid, .stat-grid.three { grid-template-columns: 1fr; }
}

// Return the local image path; direct external image links are also accepted.
function getDriveImageLink(link) {
  if (link === "") {
    return ""; // No link has been added yet.
  }
  var fileId = "";
  var filePart = "/file/d/";
  var start = link.indexOf(filePart);
  if (start !== -1) {
    var rest = link.substring(start + filePart.length);
    fileId = rest.split("/")[0];
  } else {
    var idPart = "id=";
    var idStart = link.indexOf(idPart);
    if (idStart !== -1) {
      var idRest = link.substring(idStart + idPart.length);
      fileId = idRest.split("&")[0];
    }
  }
  if (fileId !== "") {
    return "https://drive.google.com/uc?export=view&id=" + fileId;
  }
  return link; // Also accepts a direct image URL.
}

// Show a clear label if an expected image is unavailable.
function makeImagePlaceholder(label) {
  var words = label.replace("dish-", "").replace("category-", "").replace(/-/g, " ");
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450">' +
    '<rect width="700" height="450" fill="#f2f5eb"/>' +
    '<rect x="18" y="18" width="664" height="414" rx="22" fill="#fff" stroke="#e5a04b" stroke-width="4"/>' +
    '<circle cx="350" cy="170" r="64" fill="#267344"/>' +
    '<path d="M310 175 Q350 90 390 175 Q350 245 310 175" fill="#f58a27"/>' +
    '<text x="350" y="290" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#234b32">IMAGE REQUIRED</text>' +
    '<text x="350" y="335" text-anchor="middle" font-family="Arial" font-size="22" fill="#c45c16">' + words.toUpperCase() + '</text></svg>';
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

// Get the correct picture for a name such as paneer-tikka.jpg.
function getFoodImageUrl(imageName) {
  var key = imageName;
  if (key.indexOf(".jpg") !== -1) { key = key.substring(0, key.lastIndexOf(".")); }
  if (key.indexOf(".png") !== -1) { key = key.substring(0, key.lastIndexOf(".")); }
  if (key.indexOf(".jpeg") !== -1) { key = key.substring(0, key.lastIndexOf(".")); }
  if (key.indexOf(".webp") !== -1) { key = key.substring(0, key.lastIndexOf(".")); }
  if (key.indexOf("dish-") !== 0 && FOOD_IMAGE_LINKS["dish-" + key] !== undefined) { key = "dish-" + key; }
  var link = FOOD_IMAGE_LINKS[key];
  var finalLink = "";
  if (link !== undefined) { finalLink = getDriveImageLink(link); }
  if (finalLink === "") { return makeImagePlaceholder(key); }
  return finalLink;
}

// Load the bundled local images into the HTML image tags.
function loadFoodPageImages() {
  var pictures = document.querySelectorAll("[data-food-image]");
  for (var i = 0; i < pictures.length; i++) {
    var imageName = pictures[i].getAttribute("data-food-image");
    pictures[i].src = getFoodImageUrl(imageName);
    pictures[i].onerror = function () {
      this.onerror = null;
      this.src = makeImagePlaceholder(this.getAttribute("data-food-image"));
    };
  }
}

<script>
/* JavaScript from data.js - kept inside this HTML page. */
// ===== data.js: shared LocalStorage helpers and realistic demo data =====
// The example records help the Client and Admin pages look complete on first run.
// They are demo records only; all changes made in the website are saved in this browser.

var STATUSES = ['Pending', 'Confirmed', 'Preparing', 'Out for Delivery', 'Delivered'];

// ---------- local storage ----------
function getData(key) {
  var text = localStorage.getItem(key);
  if (text === null) {
    return [];
  }
  try {
    var value = JSON.parse(text);
    return Array.isArray(value) ? value : [];
  } catch (error) {
    return [];
  }
}

function saveData(key, list) {
  localStorage.setItem(key, JSON.stringify(list));
}

// ---------- small helper functions ----------
function money(n) {
  return '\u20B9' + n;
}

function imgPath(fileName) {
  return getFoodImageUrl('dish-' + fileName);
}

function statusClass(status) {
  return 'st-' + status.split(' ').join('-');
}

function badge(status) {
  return '<span class="badge ' + statusClass(status) + '">' + status + '</span>';
}

function starText(n) {
  var text = '';
  for (var i = 1; i <= 5; i++) {
    text = text + (i <= n ? '\u2605' : '\u2606');
  }
  return text;
}

function twoDigits(n) {
  return n < 10 ? '0' + n : '' + n;
}

// Create dates relative to today so the weekly dashboard chart is always populated.
function isoDate(daysAgo) {
  var d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.getFullYear() + '-' + twoDigits(d.getMonth() + 1) + '-' + twoDigits(d.getDate());
}

function getParam(name) {
  var query = window.location.search;
  if (query === '') {
    return null;
  }
  var parts = query.substring(1).split('&');
  for (var i = 0; i < parts.length; i++) {
    var pair = parts[i].split('=');
    if (pair[0] === name) {
      return decodeURIComponent(pair[1]);
    }
  }
  return null;
}

function showBox(id) {
  document.getElementById(id).style.display = 'block';
}
function hideBox(id) {
  document.getElementById(id).style.display = 'none';
}
function toggleBox(id) {
  var box = document.getElementById(id);
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

// ---------- demo data builders ----------
function makeDish(id, name, category, price, image, description, allergens, popularity) {
  return {
    id: id,
    name: name,
    category: category,
    price: price,
    image: image + '.jpg',
    description: description,

<script>
/* JavaScript from admin-clients.js - kept inside this HTML page. */
// ===== admin-clients.js: list of registered customers =====
checkAdminLogin();

function loadClients() {
  var users = getData('fm_users');
  var orders = getData('fm_orders');
  var search = document.getElementById('cSearch').value.toLowerCase();
  var html = '';
  for (var i = 0; i < users.length; i++) {
    var matchName = users[i].name.toLowerCase().indexOf(search) !== -1;
    var matchEmail = users[i].email.toLowerCase().indexOf(search) !== -1;
    if (matchName === false && matchEmail === false) {
      continue;
    }
    // count the orders with the same email
    var count = 0;
    for (var k = 0; k < orders.length; k++) {
      if (orders[k].userEmail === users[i].email) {
        count = count + 1;
      }
    }
    html = html + '<tr>';
    html = html + '<td>' + users[i].id + '</td>';
    html = html + '<td>' + users[i].name + '</td>';
    html = html + '<td>' + users[i].email + '</td>';
    html = html + '<td>' + users[i].phone + '</td>';
    html = html + '<td>' + count + '</td>';
    html = html + '</tr>';
  }
  if (html === '') {
    html = '<tr><td colspan="5">No clients found.</td></tr>';
  }
  document.getElementById('clientRows').innerHTML = html;
}

loadClients();

</script>
